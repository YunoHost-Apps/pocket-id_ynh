#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pocket-id"
name = "Pocket-ID"
description.en = "Easy-to-use OIDC provider that allows users to authenticate with their passkeys to your services"
description.fr = "Fournisseur OIDC simple qui permet aux utilisateurs de s'authentifier auprès de vos services à l'aide de leurs clés d'accès"

version = "2.19.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "BSD-2-Clause"
website = "https://pocket-id.org/"
demo = "https://demo.pocket-id.org/"
admindoc = "https://pocket-id.org/docs"
code = "https://github.com/pocket-id/pocket-id"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    rename = "pocket-id"
    in_subdir = false
    extract = false
    amd64.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.19.0/pocket-id_linux_amd64"
    amd64.sha256 = "d58884a28bc38f16a59f4e9a930bc231e028d9c76191f5bce295c3d8b48bee85"
    arm64.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.19.0/pocket-id_linux_arm64"
    arm64.sha256 = "29c8fa677b968a6c269e41c80bc2c524dab077d7f9486a450b4130ff1369ff10"
    armhf.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.19.0/pocket-id_linux_armv7"
    armhf.sha256 = "ba557921a06fbec1070a8f70b67ba99000bd56986c786648ddd0a36e54786658"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^pocket-id_linux_amd64$"
    autoupdate.asset.arm64 = "^pocket-id_linux_arm64$"
    autoupdate.asset.armhf = "^pocket-id_linux_armv7$"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
