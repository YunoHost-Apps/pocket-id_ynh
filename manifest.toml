#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pocket-id"
name = "Pocket-ID"
description.en = "Easy-to-use OIDC provider that allows users to authenticate with their passkeys to your services"
description.fr = "Fournisseur OIDC simple qui permet aux utilisateurs de s'authentifier auprès de vos services à l'aide de leurs clés d'accès"

version = "2.13.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "BSD-2-Clause"
website = "https://pocket-id.org/"
demo = "https://demo.pocket-id.org/"
admindoc = "https://pocket-id.org/docs"
code = "https://github.com/pocket-id/pocket-id"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    rename = "pocket-id"
    in_subdir = false
    extract = false
    amd64.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.13.0/pocket-id_linux_amd64"
    amd64.sha256 = "45b39df9f6d685dee3caa379933f72bbb41428944ee8292853fb9e0b7e8e8b56"
    arm64.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.13.0/pocket-id_linux_arm64"
    arm64.sha256 = "c51b685f655b5c12adf098c3353c27b9afc38edb407987e6e60bfecc8cbb40f8"
    armhf.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.13.0/pocket-id_linux_armv7"
    armhf.sha256 = "24512f6c497baa35f29409052c346c9eec9bc8d9ba0d6e439a58071b7c7be050"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^pocket-id_linux_amd64$"
    autoupdate.asset.arm64 = "^pocket-id_linux_arm64$"
    autoupdate.asset.armhf = "^pocket-id_linux_armv7$"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
