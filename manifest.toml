#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "pocket-id"
name = "Pocket-ID"
description.en = "Easy-to-use OIDC provider that allows users to authenticate with their passkeys to your services"
description.fr = "Fournisseur OIDC simple qui permet aux utilisateurs de s'authentifier auprès de vos services à l'aide de leurs clés d'accès"

version = "2.17.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "BSD-2-Clause"
website = "https://pocket-id.org/"
demo = "https://demo.pocket-id.org/"
admindoc = "https://pocket-id.org/docs"
code = "https://github.com/pocket-id/pocket-id"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = true
sso = false

disk = "50M"
ram.build = "100M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    rename = "pocket-id"
    in_subdir = false
    extract = false
    amd64.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.17.0/pocket-id_linux_amd64"
    amd64.sha256 = "314e167fdc0635d544e46574c9fa244aae51045a53d297ef6d614abba8785d4b"
    arm64.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.17.0/pocket-id_linux_arm64"
    arm64.sha256 = "1bfdb491aaaffaec5b25e1bed15fbcfa61e2c5e1eb064bb576582427ce81589c"
    armhf.url = "https://github.com/pocket-id/pocket-id/releases/download/v2.17.0/pocket-id_linux_armv7"
    armhf.sha256 = "b483f4222629681ef9348b371e46abe77e7ae2db611d6c9a7ff7adb3b0b20506"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^pocket-id_linux_amd64$"
    autoupdate.asset.arm64 = "^pocket-id_linux_arm64$"
    autoupdate.asset.armhf = "^pocket-id_linux_armv7$"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql"

    [resources.database]
    type = "postgresql"
